[package]
name = "league-voice-recorder"
version = "0.6.0"
edition = "2024"
authors = ["betterix"]
description = "Record League of Legends scrim voice audio and synchronize it with replay playback in native Rust."
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.40"
directories = "6.0"
id3 = "1.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
rodio = "0.23"
cpal = "0.18"
rusty_mp3 = "1.2"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2.5"

[build-dependencies]
tauri-build = "2.7"

[profile.dev]
opt-level = 1
debug = 0
strip = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = "none"
debug = false
