[package]
name = "league-voice-recorder"
version = "0.5.1"
edition = "2021"
authors = ["betterix"]
description = "Record League of Legends scrim voice audio and synchronize it with replay playback in native Rust."
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
directories = "6.0"
id3 = "1.16"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rodio = "0.23"
cpal = "0.18"
rusty_mp3 = "1.0"
tauri = "2.0"

[build-dependencies]
tauri-build = "2.0"

[profile.dev]
opt-level = 1
debug = 0
strip = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
