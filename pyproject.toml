[project]
name = "league-scrim-recorder"
version = "0.3.1"
description = "Record League of Legends scrim voice audio and synchronize it with replay playback."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "betterix" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "customtkinter>=6.0.0",
    "numpy>=2.4.6",
    "proc-tap>=1.1.1",
    "psutil>=7.2.2",
    "pyaudiowpatch>=0.2.12.9",
    "pycaw>=20260927",
    "python-dotenv>=1.2.4",
    "python-vlc>=3.0.21203",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

[tool.uv]
package = false
upgrade = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",   # Do not catch blind exception: `Exception`
    "S110",     # `try`-`except`-`pass` detected, consider logging the exception
    "E722",     # Do not use bare `except`
    "E402",     # Module level import not at top of file (required for Windows VLC DLL registration)
    "I001",     # Import block is un-sorted or un-formatted
    "PLW1510",  # `subprocess.run` without explicit `check` argument
    "SIM102",   # Use a single `if` statement instead of nested `if` statements
]

[tool.codeflash]
# All paths are relative to this pyproject.toml's directory.
module-root = "app"
tests-root = "tests"
ignore-paths = []
disable-telemetry = true
formatter-cmds = ["ruff check --exit-zero --fix $file", "ruff format $file"]

[dependency-groups]
dev = [
    "codeflash>=0.20.6",
    "nuitka>=4.3.1",
    "ruff>=0.17.3",
]
