[project]
name = "league-scrim-recorder"
version = "0.2.3"
description = "Record League of Legends scrim voice audio and synchronize it with replay playback."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "betterix" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "customtkinter>=6.0.0",
    "proc-tap>=1.1.1",
    "psutil>=5.9.0",
    "pycaw>=20260927",
    "python-dotenv>=1.2.4",
    "python-vlc>=3.0.0",
    "requests>=2.31.0",
    "sounddevice>=0.5.6",
    "urllib3>=2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",   # Do not catch blind exception: `Exception`
    "S110",     # `try`-`except`-`pass` detected, consider logging the exception
    "E722",     # Do not use bare `except`
    "E402",     # Module level import not at top of file (required for Windows VLC DLL registration)
    "I001",     # Import block is un-sorted or un-formatted
    "PLW1510",  # `subprocess.run` without explicit `check` argument
    "SIM102",   # Use a single `if` statement instead of nested `if` statements
]

[dependency-groups]
dev = [
    "nuitka>=4.3.0",
]
