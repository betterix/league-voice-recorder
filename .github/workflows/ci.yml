name: CI Quality & Test Suite

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "web/**"
      - "*.md"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Unit & Timing Accuracy Tests
    runs-on: windows-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: ⚡ Set up uv & Python 3.14
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14.10"

      - name: 🐍 Set up Python Runtime
        run: uv python install 3.14.10

      - name: 📦 Install Python Dependencies
        run: uv sync --dev --python 3.14.10

      - name: 🛠️ Install VLC Media Player and FFmpeg
        shell: pwsh
        run: |
          choco install vlc ffmpeg --no-progress -y

      - name: 🔍 Run Linter (Ruff)
        run: uv run ruff check .

      - name: 🧪 Execute Automated Test Suite (pytest)
        shell: pwsh
        run: |
          uv run pytest -v --durations=10

      - name: 📊 Generate CI Summary Dashboard
        if: always()
        shell: pwsh
        run: |
          @"
          # 🎮 League Voice Recorder — CI Verification Report

          > **Result**: ✅ **All Checks Passed** | **Linter**: Ruff | **Runner**: Windows Server 2022 | **Python**: 3.14.10

          ---

          ### 🧪 Test Suite Highlights
          - ✅ **Config & Paths**: User Documents path resolution & migration
          - ✅ **Native Audio**: Process Loopback, VU scaling & 1:1 timeline alignment
          - ✅ **Replay Auto-Sync**: 200% volume amplification & instant seek recovery
          - ✅ **In-Game Floating HUD**: Click-through hit targets, volume slider & focus isolation
          - ✅ **Auto-Updater**: SHA256 integrity, zip unpacking & in-place update engine

          ---
          *Verified with GitHub Actions on \`$env:GITHUB_REF\` (\`$env:GITHUB_SHA\`).*
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
