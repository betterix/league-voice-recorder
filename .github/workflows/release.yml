name: Build & Release Executable

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows .EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --python 3.12

      - name: Install VLC Media Player
        shell: pwsh
        run: |
          choco install vlc --no-progress -y

      - name: Run automated test suite
        run: uv run python -m unittest discover tests -v

      - name: Ensure FFmpeg binary is present
        shell: pwsh
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
              $ffmpegPath = (Get-Command ffmpeg).Source
              Write-Host "Found pre-installed FFmpeg at: $ffmpegPath"
              Copy-Item -Path $ffmpegPath -Destination "ffmpeg.exe" -Force
          } else {
              Write-Host "Downloading portable FFmpeg binary..."
              Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
              Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
              $bin = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
              Copy-Item -Path $bin.FullName -Destination "ffmpeg.exe" -Force
          }

      - name: Compile Windows executable with PyInstaller
        shell: pwsh
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed `
            --name "LeagueVoiceRecorder" `
            --collect-data customtkinter `
            --add-data "locales;locales" `
            main.py

      - name: Assemble distribution package
        shell: pwsh
        run: |
          Write-Host "Bundling assets into dist/LeagueVoiceRecorder..."
          Copy-Item -Path "ffmpeg.exe" -Destination "dist\LeagueVoiceRecorder\" -Force
          Copy-Item -Path "locales" -Destination "dist\LeagueVoiceRecorder\" -Recurse -Force
          Copy-Item -Path ".env.example" -Destination "dist\LeagueVoiceRecorder\" -Force
          if (Test-Path "LICENSE") {
              Copy-Item -Path "LICENSE" -Destination "dist\LeagueVoiceRecorder\" -Force
          }
          if (Test-Path "README.md") {
              Copy-Item -Path "README.md" -Destination "dist\LeagueVoiceRecorder\" -Force
          }

      - name: Create release zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\LeagueVoiceRecorder" -DestinationPath "LeagueVoiceRecorder-Windows-x64.zip" -Force

      - name: Upload build artifact (Actions tab)
        uses: actions/upload-artifact@v7
        with:
          name: LeagueVoiceRecorder-Windows-x64
          path: LeagueVoiceRecorder-Windows-x64.zip

      - name: Upload zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: LeagueVoiceRecorder-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
