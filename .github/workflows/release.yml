name: Build & Release Executable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows .EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14.8"

      - name: Set up Python
        run: uv python install 3.14.8

      - name: Install dependencies
        run: uv sync --dev --python 3.14.8

      - name: Install VLC Media Player
        shell: pwsh
        run: |
          choco install vlc --no-progress -y

      - name: Run automated test suite
        run: uv run python -m unittest discover tests -v

      - name: Compile Windows executable with Nuitka
        shell: pwsh
        run: |
          $base = uv run --python 3.14.8 python -c "import sys; print(sys.base_prefix)"
          $tcl_dir = Join-Path $base "tcl"
          $tk_dir = Join-Path $base "tcl\tk9.0"
          if (-not (Test-Path $tk_dir)) { $tk_dir = $tcl_dir }
          if (Test-Path "dist\build") { Remove-Item -Path "dist\build" -Recurse -Force }
          uv run --python 3.14.8 --with nuitka python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --windows-icon-from-ico=icon.ico `
            --enable-plugin=tk-inter `
            --tcl-library-dir="$tcl_dir" `
            --tk-library-dir="$tk_dir" `
            --include-data-dir=locales=locales `
            --include-data-file=icon.ico=icon.ico `
            --output-dir=dist\build `
            --output-filename=LeagueVoiceRecorder.exe `
            main.py

      - name: Assemble distribution package
        shell: pwsh
        run: |
          Write-Host "Bundling single executable into dist/LeagueVoiceRecorder..."
          if (Test-Path "dist\LeagueVoiceRecorder") {
              Remove-Item -Path "dist\LeagueVoiceRecorder" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "dist\LeagueVoiceRecorder" -Force
          Copy-Item -Path "dist\build\LeagueVoiceRecorder.exe" -Destination "dist\LeagueVoiceRecorder\LeagueVoiceRecorder.exe" -Force
          if (Test-Path "dist\build") {
              Remove-Item -Path "dist\build" -Recurse -Force
          }
          Write-Host "Contents of dist/LeagueVoiceRecorder:"
          Get-ChildItem -Path "dist\LeagueVoiceRecorder"

      - name: Create release zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\LeagueVoiceRecorder" -DestinationPath "LeagueVoiceRecorder-Windows-x64.zip" -Force

      - name: Upload build artifact (Actions tab)
        uses: actions/upload-artifact@v7
        with:
          name: LeagueVoiceRecorder-Windows-x64
          path: LeagueVoiceRecorder-Windows-x64.zip

      - name: Upload zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: LeagueVoiceRecorder-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
