name: Build & Release Executable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows .EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14.10"

      - name: Set up Python
        run: uv python install 3.14.10

      - name: Install dependencies
        run: uv sync --dev --python 3.14.10

      - name: Install VLC Media Player
        shell: pwsh
        run: |
          choco install vlc --no-progress -y

      - name: Run automated test suite
        run: uv run python -m unittest discover tests -v

      - name: Compile Windows executable with Nuitka
        shell: pwsh
        run: |
          $base = uv run --python 3.14.10 python -c "import sys; print(sys.base_prefix)"
          $tcl_dir = Join-Path $base "tcl"
          $tk_dir = Join-Path $base "tcl\tk9.0"
          if (-not (Test-Path $tk_dir)) { $tk_dir = $tcl_dir }
          if (Test-Path "dist\LeagueVoiceRecorder") { Remove-Item -Path "dist\LeagueVoiceRecorder" -Recurse -Force }
          if (Test-Path "dist\LeagueVoiceRecorder.dist") { Remove-Item -Path "dist\LeagueVoiceRecorder.dist" -Recurse -Force }
          if (Test-Path "dist\main.dist") { Remove-Item -Path "dist\main.dist" -Recurse -Force }
          uv run --python 3.14.10 python -m nuitka `
            --standalone `
            --msvc=latest `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --include-windows-runtime-dlls=yes `
            --windows-icon-from-ico=assets/icon.ico `
            --company-name="betterix" `
            --product-name="League Voice Recorder" `
            --file-version=0.3.1.0 `
            --product-version=0.3.1.0 `
            --file-description="League Voice Recorder & Replay Synchronizer" `
            --copyright="Copyright (c) 2026 betterix. GPL-3.0 License." `
            --enable-plugin=tk-inter `
            --include-package=proctap `
            --include-package=pyaudiowpatch `
            --include-package=pycaw `
            --nofollow-import-to=scipy `
            --nofollow-import-to=unittest `
            --nofollow-import-to=doctest `
            --tcl-library-dir="$tcl_dir" `
            --tk-library-dir="$tk_dir" `
            --include-data-dir=locales=locales `
            --include-data-dir=assets=assets `
            --output-dir=dist `
            --output-filename=LeagueVoiceRecorder.exe `
            main.py
          if (Test-Path "dist\LeagueVoiceRecorder.dist") {
              if (Test-Path "dist\LeagueVoiceRecorder") {
                  Remove-Item -Path "dist\LeagueVoiceRecorder" -Recurse -Force
              }
              Rename-Item -Path "dist\LeagueVoiceRecorder.dist" -NewName "LeagueVoiceRecorder"
          } elseif (Test-Path "dist\main.dist") {
              if (Test-Path "dist\LeagueVoiceRecorder") {
                  Remove-Item -Path "dist\LeagueVoiceRecorder" -Recurse -Force
              }
              Rename-Item -Path "dist\main.dist" -NewName "LeagueVoiceRecorder"
          }

      - name: Assemble distribution package
        shell: pwsh
        run: |
          Write-Host "Bundling assets into dist/LeagueVoiceRecorder..."
          if (Test-Path "locales") {
              Copy-Item -Path "locales" -Destination "dist\LeagueVoiceRecorder\locales" -Recurse -Force
          }
          if (Test-Path "LICENSE") {
              Copy-Item -Path "LICENSE" -Destination "dist\LeagueVoiceRecorder\LICENSE" -Force
          }
          if (Test-Path "README.md") {
              Copy-Item -Path "README.md" -Destination "dist\LeagueVoiceRecorder\README.md" -Force
          }
          Write-Host "Contents of dist/LeagueVoiceRecorder:"
          Get-ChildItem -Path "dist\LeagueVoiceRecorder"

      - name: Create release zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\LeagueVoiceRecorder" -DestinationPath "LeagueVoiceRecorder-Windows-x64.zip" -Force

      - name: Upload build artifact (Actions tab)
        uses: actions/upload-artifact@v7
        with:
          name: LeagueVoiceRecorder-Windows-x64
          path: LeagueVoiceRecorder-Windows-x64.zip

      - name: Upload zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: LeagueVoiceRecorder-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
