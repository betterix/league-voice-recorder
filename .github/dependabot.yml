version: 2

# Multi-ecosystem grouped updates: combines all dependency updates into a single daily PR
multi-ecosystem-groups:
  all-updates:
    schedule:
      interval: "daily"
    labels:
      - "dependencies"

updates:
  # Python dependencies (pyproject.toml & requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: "all-updates"
    patterns:
      - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-updates"
    patterns:
      - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
