<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 360px;
      height: 76px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #toast-card {
      width: 360px;
      height: 76px;
      background: #0B1329;
      border: 1.5px solid #0AC8B9;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      opacity: 0.96;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    #toast-card:hover {
      transform: translateY(-1px);
      border-color: #38BDF8;
    }

    .toast-icon {
      width: 38px;
      height: 38px;
      margin-right: 14px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .toast-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .toast-title {
      color: #0AC8B9;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 3px;
      letter-spacing: 0.2px;
    }

    .toast-desc {
      color: #E2E8F0;
      font-size: 11px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div id="toast-card" onclick="restoreApp()">
    <img src="assets/icon.png" class="toast-icon" alt="League Voice Recorder" onerror="this.style.display='none'">
    <div class="toast-content">
      <div class="toast-title">League Voice Recorder</div>
      <div class="toast-desc">Running in background. Click tray icon to restore.</div>
    </div>
  </div>

  <script>
    async function restoreApp() {
      const invoker = (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) ||
                      (window.__TAURI__ && window.__TAURI__.invoke) ||
                      (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);
      if (invoker) {
        try {
          await invoker("restore_main_window");
        } catch (e) {}
      }
    }
  </script>
</body>
</html>
